<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 營運助理 - 韓國時尚智慧管理後台</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
  <div class="flex h-screen overflow-hidden">
    <!-- 側邊導覽列 -->
    <aside class="w-64 bg-white border-r border-gray-200 p-6 hidden md:block">
      <h1 class="text-2xl font-bold text-gray-900 mb-1">AI 營運助理</h1>
      <p class="text-sm text-gray-500 mb-8">韓國時尚智慧管理後台</p>
      
      <nav class="space-y-2">
        <a href="#" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-gray-600 hover:bg-gray-100">📄 文案生成</a>
        <a href="#" class="flex items-center gap-3 px-4 py-2.5 rounded-lg bg-gray-900 text-white font-medium">🖼️ 圖片生成文案</a>
        <a href="#" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-gray-600 hover:bg-gray-100">🎬 影片生成文案</a>
        <a href="#" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-gray-600 hover:bg-gray-100">📊 韓國東大門流行趨勢</a>
        <a href="#" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-gray-600 hover:bg-gray-100">💰 價格試算器</a>
      </nav>
      <div class="absolute bottom-6 text-xs text-gray-400">LovelyByKorea Admin v4.4</div>
    </aside>

    <!-- 主要內容區 -->
    <main class="flex-1 overflow-y-auto p-8">
      <header class="mb-8 flex justify-between items-center">
        <div>
          <h2 class="text-2xl font-bold">圖片生成文案與一鍵發佈</h2>
          <p class="text-sm text-gray-500">CEO 專屬後台 | 支援 Meta (FB & IG) 智慧雙平台同步發布</p>
        </div>
      </header>

      <!-- 圖片文案生成區 -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-8">
        <h3 class="text-lg font-semibold mb-4 flex items-center gap-2">🖼️ 圖片視覺分析與文案生成</h3>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">上傳商品圖片 (服飾/包款/鞋款/飾品)</label>
            <input type="file" id="imageInput" accept="image/*" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-violet-50 file:text-violet-700 hover:file:bg-violet-100">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">補充說明或推廣訴求</label>
            <input type="text" id="promptInput" placeholder="例如：顯瘦修身針織外套，韓國連線特惠..." class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-violet-500 focus:outline-none">
          </div>
        </div>

        <button onclick="generateContent()" class="w-full bg-gray-900 text-white py-3 rounded-lg font-medium hover:bg-gray-800 transition">
          ✨ 分析圖片並生成 3 組文案
        </button>
      </div>

      <!-- 結果與一鍵發佈區 -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-8">
        <h3 class="text-lg font-semibold mb-4">✨ AI 視覺分析與文案結果</h3>
        <div id="resultOutput" class="p-4 bg-gray-50 rounded-lg text-gray-700 whitespace-pre-line min-h-[120px] mb-6">
          尚未開始生成，請上傳圖片並點擊按鈕。
        </div>

        <!-- 🚀 Meta 一鍵發佈專區 -->
        <div class="border-t pt-6">
          <h4 class="text-md font-semibold mb-3">📱 Meta 智慧雙平台一鍵發佈</h4>
          <p class="text-xs text-gray-500 mb-4">系統會自動將您上傳的圖片轉為公開連結，並將文案智慧改寫為 FB 與 IG 各自最適合的風格同步發布！</p>
          
          <button onclick="publishToMeta()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-medium transition flex items-center justify-center gap-2 w-full md:w-auto">
            🚀 一鍵發佈至 FB 粉絲專頁與 IG 商業帳號
          </button>

          <div id="publishStatus" class="mt-4 text-sm font-medium"></div>
        </div>
      </div>
    </main>
  </div>

  <script>
    let lastGeneratedText = "";

    async function generateContent() {
      const fileInput = document.getElementById('imageInput');
      const promptInput = document.getElementById('promptInput').value;
      const output = document.getElementById('resultOutput');

      if (fileInput.files.length === 0) {
        alert('請先上傳商品圖片！');
        return;
      }

      output.innerText = "AI 正在努力分析圖片與生成文案中，請稍候...";

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = async function(e) {
        const base64String = e.target.result.split(',')[1];

        try {
          const response = await fetch('/api/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              prompt: promptInput || "請為這款韓國女裝生成吸引人的銷售文案",
              imageBase64: base64String
            })
          });

          const data = await response.json();
          if (response.ok) {
            lastGeneratedText = data.candidates[0].content.parts[0].text;
            output.innerText = lastGeneratedText;
          } else {
            output.innerText = "生成失敗: " + (data.error || "未知錯誤");
          }
        } catch (err) {
          output.innerText = "網路連線錯誤: " + err.message;
        }
      };

      reader.readAsDataURL(file);
    }

    async function publishToMeta() {
      const fileInput = document.getElementById('imageInput');
      const statusDiv = document.getElementById('publishStatus');

      if (fileInput.files.length === 0) {
        alert('請先上傳商品圖片！');
        return;
      }

      const file = fileInput.files[0];
      const messageToUse = lastGeneratedText || document.getElementById('promptInput').value || "韓國女裝新品連線！";

      statusDiv.innerHTML = "<span class='text-blue-600'>⏳ 正在自動處理圖片並透過 AI 分流文案，同步發布至 FB 與 IG，請稍候...</span>";

      const reader = new FileReader();
      reader.onload = async function(e) {
        const base64String = e.target.result.split(',')[1];

        try {
          const response = await fetch('/api/publish-meta', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message: messageToUse,
              imageBase64: base64String
            })
          });

          const result = await response.json();

          if (response.ok) {
            statusDiv.innerHTML = `
              <div class="p-4 bg-green-50 border border-green-200 rounded-lg text-green-800 space-y-2">
                <p class="font-bold">✅ 雙平台同步發布成功！</p>
                <p class="text-xs text-gray-500">自動生成圖床網址: ${result.image_url_used}</p>
                <p><strong>【FB 實際發布文案】:</strong> ${result.fb_caption_used}</p>
                <p><strong>【IG 實際發布文案】:</strong> ${result.ig_caption_used}</p>
              </div>
            `;
          } else {
            statusDiv.innerHTML = `<span class='text-red-600'>❌ 發布失敗: ${result.error || JSON.stringify(result)}</span>`;
          }
        } catch (err) {
          statusDiv.innerHTML = `<span class='text-red-600'>❌ 網路請求失敗: ${err.message}</span>`;
        }
      };

      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
