<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>韓國女裝 AI 智慧後台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Marked.js 解析器 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; font-size: 1.15rem; }
        html, body { width: 100%; max-width: 100vw; overflow-x: hidden; box-sizing: border-box; margin: 0; padding: 0; }
        *, *:before, *:after { box-sizing: inherit; }

        /* 📌 Markdown 防跑版樣式 */
        .markdown-body {
            width: 100%;
            max-width: 100%;
            word-break: break-word;
            overflow-wrap: anywhere;
            line-height: 1.7;
        }

        .markdown-body a {
            color: #2563eb;
            text-decoration: underline;
            font-weight: 500;
            word-break: break-all;
        }

        /* 📸 IG 爆款連結：專屬漸層按鈕 */
        .markdown-body a[href*="instagram.com"], .markdown-body a.ig-btn-link {
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 4px !important;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%) !important;
            color: #ffffff !important;
            font-weight: 700 !important;
            padding: 6px 12px !important;
            border-radius: 8px !important;
            text-decoration: none !important;
            font-size: 0.85rem !important;
            box-shadow: 0 2px 5px rgba(220, 39, 67, 0.25) !important;
            white-space: nowrap !important;
            margin: 3px 0 !important;
            transition: all 0.2s ease !important;
            cursor: pointer !important;
            -webkit-tap-highlight-color: transparent;
        }
        .markdown-body a[href*="instagram.com"]:active, .markdown-body a.ig-btn-link:active {
            transform: scale(0.96);
            opacity: 0.9;
        }

        .markdown-body table {
            width: 100% !important;
            max-width: 100% !important;
            border-collapse: collapse;
            margin-top: 1rem;
            margin-bottom: 1rem;
            display: block !important;
            overflow-x: auto !important;
            -webkit-overflow-scrolling: touch;
            white-space: normal;
        }
        .markdown-body th, .markdown-body td {
            border: 1px solid #e5e7eb;
            padding: 0.6rem 0.8rem;
            text-align: left;
            word-break: break-word;
            min-width: 80px;
            font-size: 0.9rem;
        }
        .markdown-body th {
            background-color: #f3f4f6;
            font-weight: 700;
            white-space: nowrap;
        }
        .markdown-body ul, .markdown-body ol {
            padding-left: 1.25rem;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .markdown-body ul { list-style-type: disc; }
        .markdown-body ol { list-style-type: decimal; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 {
            font-weight: 700;
            margin-top: 1.25rem;
            margin-bottom: 0.5rem;
            color: #111827;
        }
        .markdown-body h3 { font-size: 1.15rem; }
        .markdown-body p { margin-bottom: 0.75rem; }
        .markdown-body hr {
            border: 0;
            height: 1px;
            background: #e5e7eb;
            margin: 1.25rem 0;
        }

        /* 📱 預覽視窗三平台頁籤樣式 (桌機與手機共用) */
        .pub-tab-btn {
            flex: 1;
            text-align: center;
            padding: 10px 16px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 10px;
            background-color: #f3f4f6;
            color: #6b7280;
            transition: all 0.2s;
            cursor: pointer;
            border: 1px solid #e5e7eb;
        }
        .pub-tab-btn.active-fb { background-color: #eff6ff; color: #2563eb; border-color: #bfdbfe; }
        .pub-tab-btn.active-ig { background-color: #fdf2f8; color: #db2777; border-color: #fbcfe8; }
        .pub-tab-btn.active-th { background-color: #f3f4f6; color: #111827; border-color: #d1d5db; }
        
        .pub-panel { display: none; }
        .pub-panel.active { display: flex; flex-direction: column; }
    </style>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                    registration.unregister();
                }
            });
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 flex h-screen overflow-hidden">

    <!-- 桌面版側邊欄 -->
    <aside class="hidden md:flex w-72 bg-white border-r border-gray-200 flex-col justify-between shrink-0 z-20">
        <div>
            <div class="p-6 border-b border-gray-100">
                <h1 class="text-2xl font-bold tracking-wider text-gray-900">AI 營運助理</h1>
                <p class="text-sm text-gray-400 mt-1">韓國時尚智慧管理後台</p>
            </div>
            <nav class="p-4 space-y-1.5">
                <button type="button" onclick="switchTab('copywriting')" id="desktop-nav-copywriting" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-lg text-base font-medium text-gray-600 hover:bg-gray-50 transition-colors text-left cursor-pointer">
                    <span>📄</span> 文案生成
                </button>
                <button type="button" onclick="switchTab('image-copy')" id="desktop-nav-image-copy" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-lg text-base font-medium bg-gray-100 text-gray-900 transition-colors text-left cursor-pointer">
                    <span>🖼️</span> 圖片生成文案
                </button>
                <button type="button" onclick="switchTab('video-copy')" id="desktop-nav-video-copy" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-lg text-base font-medium text-gray-600 hover:bg-gray-50 transition-colors text-left cursor-pointer">
                    <span>🎬</span> 影片生成文案
                </button>
                <button type="button" onclick="switchTab('trend')" id="desktop-nav-trend" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-lg text-base font-medium text-gray-600 hover:bg-gray-50 transition-colors text-left cursor-pointer">
                    <span>📊</span> 韓國東大門流行趨勢
                </button>
                <button type="button" onclick="switchTab('pricing')" id="desktop-nav-pricing" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-lg text-base font-medium text-gray-600 hover:bg-gray-50 transition-colors text-left cursor-pointer">
                    <span>💰</span> 價格試算器
                </button>
            </nav>
        </div>

        <div class="p-4 border-t border-gray-100 space-y-3">
            <button type="button" onclick="switchTab('history')" id="desktop-nav-history" class="w-full bg-gray-900 hover:bg-gray-800 text-white py-3 rounded-lg font-medium transition-colors shadow-sm text-base flex items-center justify-center gap-2 cursor-pointer">
                <span>📂</span> 歷史紀錄 <span id="cloud-status" class="text-xs text-green-400 font-normal">(雲端同步中)</span>
            </button>
            <div class="text-sm text-gray-400 text-center">
                LovelyByKorea Admin v4.5
            </div>
        </div>
    </aside>

    <!-- 主畫面容器 -->
    <main class="flex-1 flex flex-col overflow-y-auto relative bg-gray-50">
        <header class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center shadow-sm shrink-0 z-10">
            <h2 id="page-title" class="text-lg md:text-xl font-semibold text-gray-800">圖片生成文案</h2>
            <div class="text-sm md:text-base text-gray-500 font-medium">CEO 專屬後台</div>
        </header>

        <div class="px-3 md:px-8 pt-4 md:pt-6 pb-28 md:pb-12 max-w-6xl w-full mx-auto">
            
            <!-- 1. 圖片生成文案 -->
            <div id="tab-image-copy" class="space-y-6 pt-2">
                <div class="bg-white p-5 md:p-8 rounded-2xl border border-gray-200 shadow-sm space-y-6">
                    <div class="border-b border-gray-100 pb-4 flex justify-between items-center">
                        <h3 class="font-bold text-gray-900 text-base md:text-lg">🖼️ 圖片視覺分析與文案生成</h3>
                        <button type="button" onclick="resetModule('img')" class="bg-gray-100 hover:bg-gray-200 text-red-600 px-4 py-2 rounded-xl text-sm font-medium border border-gray-300 transition-colors cursor-pointer">🔄 重置</button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-start">
                        <div class="md:col-span-4 flex flex-col items-center justify-center border-2 border-dashed border-gray-300 rounded-xl p-2 bg-gray-50 h-64 md:h-72 relative overflow-hidden">
                            <div id="preview-placeholder-img" class="text-center text-gray-400">
                                <span class="text-4xl">🖼️</span>
                                <p class="text-sm mt-2 font-medium">上傳商品的圖片預覽</p>
                            </div>
                            <img id="image-preview" src="" alt="預覽圖" class="absolute inset-0 w-full h-full object-contain hidden bg-black/5">
                        </div>
                        <div class="md:col-span-8 space-y-5">
                            <div>
                                <label class="block text-sm md:text-base font-medium text-gray-700 mb-1.5">上傳商品圖片 (服飾/包款/鞋款/飾品皆可)</label>
                                <input type="file" id="image-file" accept="image/*" onchange="previewFile(event, 'image')" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-gray-900 file:text-white hover:file:bg-gray-800 cursor-pointer">
                            </div>
                            <div>
                                <div class="flex justify-between items-center mb-1.5">
                                    <label class="block text-sm md:text-base font-medium text-gray-700">補充說明或推廣訴求</label>
                                    <button type="button" onclick="deleteSelectedPrompt('img')" id="delete-prompt-btn-img" class="text-xs text-red-500 hover:text-red-700 font-medium hidden cursor-pointer">❌ 刪除此自訂項目</button>
                                </div>
                                <div class="mb-2.5">
                                    <select id="preset-prompts-img" onchange="selectPresetPrompt('img')" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm md:text-base bg-white focus:ring-2 focus:ring-gray-900 focus:outline-none">
                                        <option value="">-- 選擇常用或自訂項目 --</option>
                                    </select>
                                </div>
                                <div class="flex flex-col md:flex-row gap-2">
                                    <input type="text" id="prompt-text-img" placeholder="或直接在此輸入新的補充說明..." class="w-full md:flex-1 border border-gray-300 rounded-xl px-4 py-2.5 text-sm md:text-base focus:ring-2 focus:ring-gray-900 focus:outline-none">
                                    <button type="button" onclick="saveCustomPrompt('img')" class="w-full md:w-auto bg-gray-100 hover:bg-gray-200 text-gray-700 px-5 py-2.5 rounded-xl text-sm md:text-base font-medium border border-gray-300 whitespace-nowrap cursor-pointer">💾 儲存</button>
                                </div>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-1">
                                <button type="button" onclick="generateImageText()" id="submit-btn-img" class="w-full bg-gray-900 hover:bg-gray-800 text-white py-3.5 rounded-xl font-medium shadow-sm text-sm md:text-base transition-colors cursor-pointer flex items-center justify-center">
                                    ✨ 分析圖片並生成 3 組文案
                                </button>
                                <label class="flex items-center justify-center gap-2 bg-gray-50 px-4 py-3.5 rounded-xl border border-gray-300 cursor-pointer shadow-sm hover:bg-gray-100 transition-colors w-full">
                                    <input type="checkbox" id="mock-ai-toggle-img" class="w-4 h-4 text-gray-900 rounded focus:ring-gray-900 cursor-pointer">
                                    <span class="text-xs md:text-sm font-bold text-gray-700 text-center">⚡ 使用模擬備用 AI</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="bg-white p-5 md:p-8 rounded-2xl border border-gray-200 shadow-sm space-y-3">
                    <h3 class="text-sm md:text-base font-semibold text-gray-700 flex items-center gap-2"><span>✨</span> AI 視覺分析與文案結果</h3>
                    <div id="result-box-img" class="bg-gray-50 border border-gray-200 rounded-xl p-4 md:p-5 text-sm md:text-base text-gray-700 min-h-[240px] leading-relaxed markdown-body">尚未開始生成，請上傳圖片並點擊按鈕。</div>
                </div>
            </div>

            <!-- 2. 文案生成 -->
            <div id="tab-general-copy" class="hidden space-y-6 pt-2">
                <div class="bg-white p-5 md:p-8 rounded-2xl border border-gray-200 shadow-sm space-y-6">
                    <div class="border-b border-gray-100 pb-4 flex justify-between items-center">
                        <h3 class="font-bold text-gray-900 text-base md:text-lg">📄 純文字文案生成設定</h3>
                        <button type="button" onclick="resetModule('gen')" class="bg-gray-100 hover:bg-gray-200 text-red-600 px-4 py-2 rounded-xl text-sm font-medium border border-gray-300 transition-colors cursor-pointer">🔄 重置</button>
                    </div>
                    <div class="space-y-5">
                        <div>
                            <label class="block text-sm md:text-base font-medium text-gray-700 mb-1.5">商品主題 / 品項名稱</label>
                            <input type="text" id="gen-topic" placeholder="例如：韓國真皮托特包、早秋針織外套、復古金屬耳環..." class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm md:text-base focus:ring-2 focus:ring-gray-900 focus:outline-none">
                        </div>
                        <div>
                            <div class="flex justify-between items-center mb-1.5">
                                <label class="block text-sm md:text-base font-medium text-gray-700">風格要求與訴求</label>
                                <button type="button" onclick="deleteSelectedPrompt('gen')" id="delete-prompt-btn-gen" class="text-xs text-red-500 hover:text-red-700 font-medium hidden cursor-pointer">❌ 刪除此自訂項目</button>
                            </div>
                            <div class="mb-2.5">
                                <select id="preset-prompts-gen" onchange="selectPresetPrompt('gen')" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm md:text-base bg-white focus:ring-2 focus:ring-gray-900 focus:outline-none">
                                    <option value="">-- 選擇常用或自訂項目 --</option>
                                </select>
                            </div>
                            <div class="flex flex-col md:flex-row gap-2">
                                <input type="text" id="gen-style" placeholder="或直接在此輸入新的風格要求與訴求..." class="w-full md:flex-1 border border-gray-300 rounded-xl px-4 py-2.5 text-sm md:text-base focus:ring-2 focus:ring-gray-900 focus:outline-none">
                                <button type="button" onclick="saveCustomPrompt('gen')" class="w-full md:w-auto bg-gray-100 hover:bg-gray-200 text-gray-700 px-5 py-2.5 rounded-xl text-sm md:text-base font-medium border border-gray-300 whitespace-nowrap cursor-pointer">💾 儲存</button>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-1">
                            <button type="button" onclick="generateTextOnly()" id="submit-btn-gen" class="w-full bg-gray-900 hover:bg-gray-800 text-white py-3.5 rounded-xl font-medium shadow-sm text-sm md:text-base transition-colors cursor-pointer flex items-center justify-center">
                                ✨ 生成 3 組專屬文案
                            </button>
                            <label class="flex items-center justify-center gap-2 bg-gray-50 px-4 py-3.5 rounded-xl border border-gray-300 cursor-pointer shadow-sm hover:bg-gray-100 transition-colors w-full">
                                <input type="checkbox" id="mock-ai-toggle-gen" class="w-4 h-4 text-gray-900 rounded focus:ring-gray-900 cursor-pointer">
                                <span class="text-xs md:text-sm font-bold text-gray-700 text-center">⚡ 使用模擬備用 AI</span>
                            </label>
                        </div>
                    </div>
                </div>
                <div class="bg-white p-5 md:p-8 rounded-2xl border border-gray-200 shadow-sm space-y-3">
                    <h3 class="text-sm md:text-base font-semibold text-gray-700 flex items-center gap-2"><span>✨
