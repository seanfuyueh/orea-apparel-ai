<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>韓國女裝 AI 智慧後台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; font-size: 1.15rem; }
        html, body { width: 100%; max-width: 100vw; overflow-x: hidden; box-sizing: border-box; margin: 0; padding: 0; }
        *, *:before, *:after { box-sizing: inherit; }

        .markdown-body {
            width: 100%;
            max-width: 100%;
            word-break: break-word;
            overflow-wrap: anywhere;
            line-height: 1.7;
        }
        .markdown-body a { color: #2563eb; text-decoration: underline; font-weight: 500; word-break: break-all; }
        .markdown-body a[href*="instagram.com"], .markdown-body a.ig-btn-link {
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 4px !important;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%) !important;
            color: #ffffff !important;
            font-weight: 700 !important;
            padding: 6px 12px !important;
            border-radius: 8px !important;
            text-decoration: none !important;
            font-size: 0.85rem !important;
            box-shadow: 0 2px 5px rgba(220, 39, 67, 0.25) !important;
            white-space: nowrap !important;
            margin: 3px 0 !important;
        }
        .markdown-body table { width: 100% !important; border-collapse: collapse; margin-top: 1rem; margin-bottom: 1rem; display: block !important; overflow-x: auto !important; }
        .markdown-body th, .markdown-body td { border: 1px solid #e5e7eb; padding: 0.6rem 0.8rem; text-align: left; }
        .markdown-body th { background-color: #f3f4f6; font-weight: 700; }
        .markdown-body ul, .markdown-body ol { padding-left: 1.25rem; margin-top: 0.5rem; margin-bottom: 0.5rem; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { font-weight: 700; margin-top: 1.25rem; margin-bottom: 0.5rem; color: #111827; }
        .markdown-body p { margin-bottom: 0.75rem; }

        @media (max-width: 768px) {
            #modal-content-box, #publish-modal-content-box { width: 95vw !important; max-height: 88vh !important; margin: 0 auto; }
            #modal-body, #publish-modal-body { padding: 1rem !important; }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 flex h-screen overflow-hidden">

    <!-- 桌面版側邊欄 -->
    <aside class="hidden md:flex w-72 bg-white border-r border-gray-200 flex-col justify-between shrink-0 z-20">
        <div>
            <div class="p-6 border-b border-gray-100">
                <h1 class="text-2xl font-bold tracking-wider text-gray-900">AI 營運助理</h1>
                <p class="text-sm text-gray-400 mt-1">韓國時尚智慧管理後台</p>
            </div>
            <nav class="p-4 space-y-1.5">
                <button type="button" onclick="switchTab('copywriting')" id="desktop-nav-copywriting" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-lg text-base font-medium text-gray-600 hover:bg-gray-50 transition-colors text-left cursor-pointer"><span>📄</span> 文案生成</button>
                <button type="button" onclick="switchTab('image-copy')" id="desktop-nav-image-copy" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-lg text-base font-medium bg-gray-100 text-gray-900 transition-colors text-left cursor-pointer"><span>🖼️</span> 圖片生成文案</button>
                <button type="button" onclick="switchTab('video-copy')" id="desktop-nav-video-copy" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-lg text-base font-medium text-gray-600 hover:bg-gray-50 transition-colors text-left cursor-pointer"><span>🎬</span> 影片生成文案</button>
                <button type="button" onclick="switchTab('trend')" id="desktop-nav-trend" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-lg text-base font-medium text-gray-600 hover:bg-gray-50 transition-colors text-left cursor-pointer"><span>📊</span> 韓國東大門流行趨勢</button>
                <button type="button" onclick="switchTab('pricing')" id="desktop-nav-pricing" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-lg text-base font-medium text-gray-600 hover:bg-gray-50 transition-colors text-left cursor-pointer"><span>💰</span> 價格試算器</button>
            </nav>
        </div>
        <div class="p-4 border-t border-gray-100 space-y-3">
            <button type="button" onclick="switchTab('history')" id="desktop-nav-history" class="w-full bg-gray-900 hover:bg-gray-800 text-white py-3 rounded-lg font-medium transition-colors shadow-sm text-base flex items-center justify-center gap-2 cursor-pointer">
                <span>📂</span> 歷史紀錄 <span id="cloud-status" class="text-xs text-green-400 font-normal">(雲端同步中)</span>
            </button>
            <div class="text-sm text-gray-400 text-center">LovelyByKorea Admin v4.7</div>
        </div>
    </aside>

    <!-- 主畫面容器 -->
    <main class="flex-1 flex flex-col overflow-y-auto relative bg-gray-50">
        <header class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center shadow-sm shrink-0 z-10">
            <h2 id="page-title" class="text-lg md:text-xl font-semibold text-gray-800">圖片生成文案</h2>
            <div class="text-sm md:text-base text-gray-500 font-medium">CEO 專屬後台</div>
        </header>

        <div class="px-3 md:px-8 pt-4 md:pt-6 pb-28 md:pb-12 max-w-6xl w-full mx-auto">
            
            <!-- 1. 圖片生成文案 -->
            <div id="tab-image-copy" class="space-y-6 pt-2">
                <div class="bg-white p-5 md:p-8 rounded-2xl border border-gray-200 shadow-sm space-y-6">
                    <div class="border-b border-gray-100 pb-4 flex justify-between items-center">
                        <h3 class="font-bold text-gray-900 text-base md:text-lg">🖼️ 圖片視覺分析與文案生成</h3>
                        <button type="button" onclick="resetModule('img')" class="bg-gray-100 hover:bg-gray-200 text-red-600 px-4 py-2 rounded-xl text-sm font-medium border border-gray-300 transition-colors cursor-pointer">🔄 重置</button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-start">
                        <div class="md:col-span-4 flex flex-col items-center justify-center border-2 border-dashed border-gray-300 rounded-xl p-2 bg-gray-50 h-64 md:h-72 relative overflow-hidden">
                            <div id="preview-placeholder-img" class="text-center text-gray-400">
                                <span class="text-4xl">🖼️</span>
                                <p class="text-sm mt-2 font-medium">上傳商品的圖片預覽</p>
                            </div>
                            <img id="image-preview" src="" alt="預覽圖" class="absolute inset-0 w-full h-full object-contain hidden bg-black/5">
                        </div>
                        <div class="md:col-span-8 space-y-5">
                            <div>
                                <label class="block text-sm md:text-base font-medium text-gray-700 mb-1.5">上傳商品圖片 (服飾/包款/鞋款/飾品皆可)</label>
                                <input type="file" id="image-file" accept="image/*" onchange="previewFile(event, 'image')" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-gray-900 file:text-white hover:file:bg-gray-800 cursor-pointer">
                            </div>
                            <div>
                                <div class="flex justify-between items-center mb-1.5">
                                    <label class="block text-sm md:text-base font-medium text-gray-700">補充說明或推廣訴求</label>
                                    <button type="button" onclick="deleteSelectedPrompt('img')" id="delete-prompt-btn-img" class="text-xs text-red-500 hover:text-red-700 font-medium hidden cursor-pointer">❌ 刪除此自訂項目</button>
                                </div>
                                <div class="mb-2.5">
                                    <select id="preset-prompts-img" onchange="selectPresetPrompt('img')" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm md:text-base bg-white focus:ring-2 focus:ring-gray-900 focus:outline-none">
                                        <option value="">-- 選擇常用或自訂項目 --</option>
                                    </select>
                                </div>
                                <div class="flex flex-col md:flex-row gap-2">
                                    <input type="text" id="prompt-text-img" placeholder="或直接在此輸入新的補充說明..." class="w-full md:flex-1 border border-gray-300 rounded-xl px-4 py-2.5 text-sm md:text-base focus:ring-2 focus:ring-gray-900 focus:outline-none">
                                    <button type="button" onclick="saveCustomPrompt('img')" class="w-full md:w-auto bg-gray-100 hover:bg-gray-200 text-gray-700 px-5 py-2.5 rounded-xl text-sm md:text-base font-medium border border-gray-300 whitespace-nowrap cursor-pointer">💾 儲存</button>
                                </div>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-1">
                                <button type="button" onclick="generateImageText()" id="submit-btn-img" class="w-full bg-gray-900 hover:bg-gray-800 text-white py-3.5 rounded-xl font-medium shadow-sm text-sm md:text-base transition-colors cursor-pointer flex items-center justify-center">
                                    ✨ 分析圖片並生成 3 組文案
                                </button>
                                <label class="flex items-center justify-center gap-2 bg-gray-50 px-4 py-3.5 rounded-xl border border-gray-300 cursor-pointer shadow-sm hover:bg-gray-100 transition-colors w-full">
                                    <input type="checkbox" id="mock-ai-toggle-img" class="w-4 h-4 text-gray-900 rounded focus:ring-gray-900 cursor-pointer">
                                    <span class="text-xs md:text-sm font-bold text-gray-700 text-center">⚡ 使用模擬備用 AI</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="bg-white p-5 md:p-8 rounded-2xl border border-gray-200 shadow-sm space-y-3">
                    <h3 class="text-sm md:text-base font-semibold text-gray-700 flex items-center gap-2"><span>✨</span> AI 視覺分析與文案結果</h3>
                    <div id="result-box-img" class="bg-gray-50 border border-gray-200 rounded-xl p-4 md:p-5 text-sm md:text-base text-gray-700 min-h-[240px] leading-relaxed markdown-body">尚未開始生成，請上傳圖片並點擊按鈕。</div>
                </div>
            </div>

            <!-- 其他分頁略 (維持原樣) -->
            <div id="tab-general-copy" class="hidden space-y-6 pt-2"></div>
            <div id="tab-video-copy" class="hidden space-y-6 pt-2"></div>
            <div id="tab-trend" class="hidden space-y-6 pt-2"></div>
            <div id="tab-pricing" class="hidden space-y-6 pt-2"></div>
            <div id="tab-history" class="hidden space-y-6 pt-2"></div>
        </div>
    </main>

    <!-- 手機底部導航列 -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-1 py-2.5 flex justify-around items-center shrink-0 z-30 shadow-lg">
        <button type="button" onclick="switchTab('copywriting')" class="flex flex-col items-center gap-1 text-gray-400 py-1 px-2 rounded-xl cursor-pointer"><span class="text-lg">📄</span><span class="text-xs">文案</span></button>
        <button type="button" onclick="switchTab('image-copy')" class="flex flex-col items-center gap-1 text-gray-900 py-1 px-2 rounded-xl bg-gray-100 font-bold cursor-pointer"><span class="text-lg">🖼️</span><span class="text-xs">圖片</span></button>
        <button type="button" onclick="switchTab('video-copy')" class="flex flex-col items-center gap-1 text-gray-400 py-1 px-2 rounded-xl cursor-pointer"><span class="text-lg">🎬</span><span class="text-xs">影片</span></button>
        <button type="button" onclick="switchTab('trend')" class="flex flex-col items-center gap-1 text-gray-400 py-1 px-2 rounded-xl cursor-pointer"><span class="text-lg">📊</span><span class="text-xs">趨勢</span></button>
        <button type="button" onclick="switchTab('pricing')" class="flex flex-col items-center gap-1 text-gray-400 py-1 px-2 rounded-xl cursor-pointer"><span class="text-lg">💰</span><span class="text-xs">試算</span></button>
        <button type="button" onclick="switchTab('history')" class="flex flex-col items-center gap-1 text-gray-400 py-1 px-2 rounded-xl cursor-pointer"><span class="text-lg">📂</span><span class="text-xs">紀錄</span></button>
    </nav>

    <!-- 2. FB / IG / Threads 多平台一鍵發佈與預覽彈跳視窗 -->
    <div id="publish-modal" class="fixed inset-0 bg-black/75 z-50 hidden flex items-center justify-center p-2 md:p-4 backdrop-blur-sm">
        <div id="publish-modal-content-box" class="bg-white w-full max-w-5xl rounded-2xl shadow-2xl border border-gray-200 overflow-hidden flex flex-col h-[92vh]">
            <div class="px-4 md:px-6 py-3.5 bg-gray-900 text-white flex justify-between items-center shrink-0">
                <div class="font-semibold text-sm md:text-lg flex items-center gap-2">多平台一鍵貼文同步發佈與預覽</div>
                <button type="button" onclick="closePublishModal()" class="bg-gray-800 hover:bg-gray-700 text-white px-3 py-1.5 rounded-xl text-xs md:text-sm font-medium border border-gray-700 cursor-pointer shrink-0">❌ 取消</button>
            </div>
            
            <div id="publish-modal-body" class="p-4 md:p-6 overflow-y-auto space-y-6 flex-1 bg-gray-50">
                <div class="bg-white p-4 rounded-xl border border-gray-200 flex flex-wrap gap-6 items-center shadow-sm">
                    <span class="font-bold text-gray-800 text-sm md:text-base">📍 發佈目標平台：</span>
                    <label class="inline-flex items-center gap-2 cursor-pointer font-bold text-blue-600"><input type="checkbox" id="pub-target-fb" checked class="w-5 h-5 rounded text-blue-600"> 📘 Facebook 粉絲專頁</label>
                    <label class="inline-flex items-center gap-2 cursor-pointer font-bold text-pink-600"><input type="checkbox" id="pub-target-ig" checked class="w-5 h-5 rounded text-pink-600"> 📸 Instagram 商業帳號</label>
                    <label class="inline-flex items-center gap-2 cursor-pointer font-bold text-gray-900 opacity-80"><input type="checkbox" id="pub-target-threads" class="w-5 h-5 rounded text-gray-900"> 🧵 Threads 個人檔案 (預覽展示)</label>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                    <div class="bg-white p-4 rounded-xl border border-gray-200 space-y-3 shadow-sm flex flex-col">
                        <div class="flex justify-between items-center border-b border-gray-100 pb-2"><h4 class="font-bold text-blue-600 text-sm md:text-base">📘 FB 專屬文案</h4><span class="text-xs text-gray-400">含固定尾巴</span></div>
                        <textarea id="pub-fb-text" rows="12" class="w-full border border-gray-300 rounded-xl p-3 text-sm leading-relaxed focus:ring-2 focus:ring-blue-600 focus:outline-none flex-1"></textarea>
                    </div>
                    <div class="bg-white p-4 rounded-xl border border-gray-200 space-y-3 shadow-sm flex flex-col">
                        <div class="flex justify-between items-center border-b border-gray-100 pb-2"><h4 class="font-bold text-pink-600 text-sm md:text-base">📸 IG 專屬文案</h4><span class="text-xs text-gray-400">精簡排版</span></div>
                        <textarea id="pub-ig-text" rows="12" class="w-full border border-gray-300 rounded-xl p-3 text-sm leading-relaxed focus:ring-2 focus:ring-pink-600 focus:outline-none flex-1"></textarea>
                    </div>
                    <div class="bg-white p-4 rounded-xl border border-gray-200 space-y-3 shadow-sm flex flex-col">
                        <div class="flex justify-between items-center border-b border-gray-100 pb-2"><h4 class="font-bold text-gray-900 text-sm md:text-base">🧵 Threads 文案</h4><span class="text-xs text-gray-400">預覽展示</span></div>
                        <textarea id="pub-threads-text" rows="12" class="w-full border border-gray-300 rounded-xl p-3 text-sm leading-relaxed focus:ring-2 focus:ring-gray-900 focus:outline-none flex-1 bg-gray-50/50"></textarea>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="button" onclick="executePublishing()" id="pub-submit-btn" class="w-full bg-gradient-to-r from-blue-600 via-pink-600 to-purple-600 hover:opacity-95 text-white py-4 rounded-xl font-bold shadow-lg text-base md:text-lg transition-transform active:scale-95 cursor-pointer flex items-center justify-center gap-2">
                        🚀 一鍵發佈
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUploadedImageBase64 = null;
        let globalHistoryRecords = [];
        let hasGeneratedMap = { img: false, gen: false, vid: false };

        const FB_FIXED_FOOTER = `\n\n👇來去逛逛👇\n🏷 https://www.lovelybykorea.com/\n\n🤖𝙇𝙄𝙉𝙀@客服\n▪️ https://lin.ee/lld53QP\n\n#業界唯一超20年韓國女裝代購經驗  \n#限時95折優惠中\n#韓國代購 #韓國製\n#時尚的盡頭是簡約\n#簡約不簡單`;

        // 📌 智慧解析：將 AI 回傳內容完美拆分為各情境的 FB、IG、Threads 獨立文案
        window.renderMarkdownContent = function(elementId, text) {
            const el = document.getElementById(elementId);
            if (!el) return;

            if (typeof marked !== 'undefined' && text) {
                marked.setOptions({ gfm: true, breaks: true });
                let htmlContent = marked.parse(text);
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = htmlContent;

                tempDiv.querySelectorAll('a').forEach(a => {
                    a.setAttribute('target', '_blank');
                    a.setAttribute('rel', 'noopener noreferrer');
                    if (a.href.includes('instagram.com') || a.innerText.includes('Instagram')) {
                        a.classList.add('ig-btn-link');
                        if (!a.innerText.includes('📸')) a.innerText = '📸 ' + a.innerText;
                    }
                });
                el.innerHTML = tempDiv.innerHTML;
            } else {
                el.innerText = text || '';
            }

            if (elementId.startsWith('result-box-') && text && !text.includes('尚未開始生成')) {
                // 將視覺分析標題前面的數字「1.」拔掉
                el.innerHTML = el.innerHTML.replace(/<h[1-3]>\s*1\.\s*【/g, '<h3>【').replace(/<strong>\s*1\.\s*【/g, '<strong>【');

                // 抓取各個情境區塊
                const blocks = text.split(/(?=【情境\s*[A-Z])/g);
                if (blocks.length > 1) {
                    let visualAnalysisHtml = blocks[0]; // 頂部視覺分析
                    visualAnalysisHtml = visualAnalysisHtml.replace(/1\.\s*【/, '【');

                    el.innerHTML = `<div class="mb-6 pb-4 border-b border-gray-200">${marked.parse(visualAnalysisHtml)}</div>`;

                    for (let i = 1; i < blocks.length; i++) {
                        const blockText = blocks[i];
                        if (!blockText.trim()) continue;

                        const cardDiv = document.createElement('div');
                        cardDiv.className = 'bg-white p-5 md:p-6 rounded-2xl border border-gray-200 shadow-sm mb-5 space-y-4';
                        
                        marked.setOptions({ gfm: true, breaks: true });
                        cardDiv.innerHTML = marked.parse(blockText);

                        const btnDiv = document.createElement('div');
                        btnDiv.className = 'pt-4 border-t border-gray-100 flex flex-wrap justify-between items-center gap-3';
                        
                        const logosHtml = `
                            <div class="flex items-center gap-2 text-xs font-bold text-gray-500">
                                <span>支援發佈：</span>
                                <span class="inline-flex items-center gap-1 bg-blue-50 text-blue-700 px-2.5 py-1 rounded-md border border-blue-200">📘 FB</span>
                                <span class="inline-flex items-center gap-1 bg-pink-50 text-pink-700 px-2.5 py-1 rounded-md border border-pink-200">📸 IG</span>
                                <span class="inline-flex items-center gap-1 bg-gray-100 text-gray-800 px-2.5 py-1 rounded-md border border-gray-300">🧵 Threads</span>
                            </div>
                        `;

                        const escapedBlockText = encodeURIComponent(blockText);
                        btnDiv.innerHTML = logosHtml + `
                            <button type="button" onclick="openPublishModalSingle('${escapedBlockText}')" class="bg-gradient-to-r from-blue-600 via-pink-600 to-purple-600 hover:opacity-90 text-white px-5 py-2.5 rounded-xl font-bold shadow-md text-sm transition-transform active:scale-95 cursor-pointer flex items-center gap-2">
                                🚀 一鍵發佈
                            </button>
                        `;
                        cardDiv.appendChild(btnDiv);
                        el.appendChild(cardDiv);
                    }
                }
            }
        };

        window.openPublishModalSingle = function(encodedText) {
            const rawBlockText = decodeURIComponent(encodedText);
            
            // 清理結構標籤
            let cleanBody = rawBlockText.replace(/【情境\s*[A-Z].*?】/g, "").trim();
            cleanBody = cleanBody.replace(/文案標題：/g, "").replace(/內文：/g, "").replace(/Hashtags：/g, "");

            // 針對三大平台量身打造獨立文案內容
            const fbText = `✨【新品上市熱銷中】✨\n\n` + cleanBody + FB_FIXED_FOOTER;
            const igText = cleanBody + `\n\n#韓國連線 #東大門代購 #OOTD #穿搭分享`;
            const threadsText = `今天這套真的超好看！大家覺得怎麼樣？💬\n\n` + cleanBody;

            document.getElementById('pub-fb-text').value = fbText;
            document.getElementById('pub-ig-text').value = igText;
            document.getElementById('pub-threads-text').value = threadsText;
            document.getElementById('publish-modal').classList.remove('hidden');
        };

        window.closePublishModal = function() {
            document.getElementById('publish-modal').classList.add('hidden');
        };

        window.executePublishing = async function() {
            const pubFb = document.getElementById('pub-target-fb').checked;
            const pubIg = document.getElementById('pub-target-ig').checked;
            const pubThreads = document.getElementById('pub-target-threads').checked;
            const fbCaption = document.getElementById('pub-fb-text').value;
            const igCaption = document.getElementById('pub-ig-text').value;
            const submitBtn = document.getElementById('pub-submit-btn');

            if (!pubFb && !pubIg && !pubThreads) { alert('請至少勾選一個發布目標平台！'); return; }

            submitBtn.disabled = true;
            submitBtn.innerText = '⏳ 貼文同步發佈中，請稍候...';

            try {
                const response = await fetch('/api/publish-post', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        publishFb: pubFb,
                        publishIg: pubIg,
                        fbCaption: fbCaption,
                        igCaption: igCaption,
                        imageBase64: currentUploadedImageBase64
                    })
                });

                const data = await response.json();
                if (response.ok) {
                    alert('🎉 貼文發佈完成！');
                    window.closePublishModal();
                } else {
                    alert('發佈失敗：' + (data.error || '未知的錯誤'));
                }
            } catch (error) {
                alert('連線發生錯誤：' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = '🚀 一鍵發佈';
            }
        };

        window.previewFile = function(event, type) {
            const file = event.target.files[0];
            if (type === 'image' && file) {
                const reader = new FileReader();
                reader.onload = e => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > 1024 || h > 1024) {
                            if (w > h) { h = Math.round((h * 1024) / w); w = 1024; }
                            else { w = Math.round((w * 1024) / h); h = 1024; }
                        }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        currentUploadedImageBase64 = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
                        document.getElementById('image-preview').src = canvas.toDataURL('image/jpeg', 0.8);
                        document.getElementById('image-preview').classList.remove('hidden');
                        document.getElementById('preview-placeholder-img').classList.add('hidden');
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        };

        window.generateImageText = async function() {
            const submitBtn = document.getElementById('submit-btn-img');
            submitBtn.disabled = true; submitBtn.innerText = 'AI 視覺分析中...';

            const prompt = `你是一位專業的韓國時尚品牌行銷總監。請針對這張圖片進行視覺分析與文案生成：
【嚴格品項辨識與視覺分析】：客觀描述圖片中的真實服飾、包款或配件材質與設計細節。
【高質感社群行銷文案生成】：撰寫 3 組不同情境（【情境 A】、【情境 B】、【情境 C】）的網拍行銷文案。`;

            try {
                const res = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt, imageBase64: currentUploadedImageBase64 })
                });
                const data = await res.json();
                const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "生成失敗";
                window.renderMarkdownContent('result-box-img', text);
            } catch (e) {
                alert('生成發生錯誤');
            } finally {
                submitBtn.disabled = false; submitBtn.innerText = '✨ 分析圖片並生成 3 組文案';
            }
        };

        window.switchTab = function(tab) {
            localStorage.setItem('active_tab', tab);
        };
    </script>
</body>
</html>
